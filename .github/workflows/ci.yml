name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: .NET API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore API
        run: dotnet restore EnterpriseFullStackReference.Api/EnterpriseFullStackReference.Api.csproj

      - name: Restore tests
        run: dotnet restore EnterpriseFullStackReference.Api.Tests/EnterpriseFullStackReference.Api.Tests.csproj

      - name: Build API
        run: dotnet build EnterpriseFullStackReference.Api/EnterpriseFullStackReference.Api.csproj --configuration Release --no-restore

      - name: Test API
        run: dotnet test EnterpriseFullStackReference.Api.Tests/EnterpriseFullStackReference.Api.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    name: Angular Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build client
        run: npm run build

      - name: Test client
        run: npm test -- --browsers=ChromeHeadless
