<section class="card">
  <div class="section-heading">
    <div>
      <p class="eyebrow">Customer Directory</p>
      <h2>Customer Search</h2>
    </div>
    <span>Server-side filtering, sorting, and paging</span>
  </div>

  <div class="toolbar">
    <label>Search<input [(ngModel)]="searchText" (keyup.enter)="onSearch()" placeholder="Number, company, contact, email or city"></label>
    <label>State<input [(ngModel)]="state" (keyup.enter)="onSearch()" maxlength="50" placeholder="TX"></label>
    <label>Visibility<select [(ngModel)]="activeFilter"><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></label>
    <div class="actions"><button type="button" class="primary" (click)="onSearch()">Search</button><button type="button" (click)="onReset()">Reset</button></div>
  </div>

  @if (error) { <div class="error" role="alert">{{ error }}</div> }

  <div class="grid-wrap">
    <ag-grid-angular
      class="ag-theme-quartz"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [animateRows]="true"
      [suppressMultiSort]="true"
      (gridReady)="onGridReady($event)"
      (sortChanged)="onSortChanged($event)">
    </ag-grid-angular>
    @if (loading) { <div class="loading-mask">Loading customers…</div> }
  </div>

  <footer class="pager">
    <span>{{ totalCount }} customer{{ totalCount === 1 ? '' : 's' }}</span>
    <div>
      <label>Rows<select [(ngModel)]="pageSize" (change)="onPageSizeChange()"><option [ngValue]="10">10</option><option [ngValue]="25">25</option><option [ngValue]="50">50</option><option [ngValue]="100">100</option></select></label>
      <button type="button" (click)="previousPage()" [disabled]="pageNumber <= 1 || loading">Previous</button>
      <span>Page {{ pageNumber }} of {{ totalPages || 1 }}</span>
      <button type="button" (click)="nextPage()" [disabled]="pageNumber >= totalPages || loading">Next</button>
    </div>
  </footer>
</section>
